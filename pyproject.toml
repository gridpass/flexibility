[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpass-flexibility"
version = "0.3.5"
description = "Independent open-source screening for large-load grid flexibility"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "GridPass contributors"}]
dependencies = []
readme = "README.md"

[project.optional-dependencies]
optimization = ["scipy>=1.11,<2", "numpy>=1.24,<3", "jsonschema>=4.20,<5"]
agent = ["mcp>=1.12,<2", "scipy>=1.11,<2", "numpy>=1.24,<3", "jsonschema>=4.20,<5"]
guard = ["cryptography>=41,<47"]

[project.urls]
Homepage = "https://gridpass.co/"
Repository = "https://github.com/gridpass/flexibility"

[project.scripts]
gridpass-flexibility = "gridpass_flexibility.__main__:main"
gridpass-flexibility-mcp = "gridpass_flexibility.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridpass_flexibility = ["schemas/*.json"]
