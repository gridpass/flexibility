name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[agent,guard,host]"
      - run: python -m unittest discover -s tests -v
      - run: gridpass-flexibility examples/data-centre.json
      - run: gridpass-flexibility --dispatch examples/chronological.json
      - run: gridpass-flexibility --dispatch examples/discrete-dispatch.json
      - run: gridpass-flexibility --dispatch examples/thermal-dispatch.json
      - run: gridpass-flexibility --size examples/capacity-sizing.json
      - run: gridpass-flexibility --stress examples/annual-stress.json
      - run: gridpass-flexibility --causal examples/causal-replay.json
      - run: python -m gridpass_flexibility.guard_demo examples/guard-site.json > guard-trace.json
      - run: gridpass-flexibility --economics examples/lifecycle-economics.json
