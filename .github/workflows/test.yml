name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[optimization,guard]"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m gridpass_flexibility examples/data-centre.json
      - run: PYTHONPATH=src python -m gridpass_flexibility --dispatch examples/chronological.json
      - run: PYTHONPATH=src python -m gridpass_flexibility.guard_demo examples/guard-site.json > guard-trace.json
